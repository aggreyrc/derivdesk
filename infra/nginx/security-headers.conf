# Security headers for the STATIC web apps (apps/web, apps/admin) when they are served from nginx
# (or the equivalent in your CDN / static host). The Express APIs already send their own via helmet;
# a built SPA is just files, so nothing sets these unless the host does.
#
# Include inside the `server { }` block that serves the built SPA:    include /etc/nginx/snippets/security-headers.conf;
#
# Replace API_ORIGIN with the API's origin, e.g. https://api.example.com, in BOTH connect-src entries
# (the second is the same host over wss:// for the live-data WebSocket).
#
# style-src needs 'unsafe-inline' because React renders inline style="" attributes throughout the UI;
# script-src stays strict ('self' only — no inline, no eval), which is the directive that matters for XSS.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' API_ORIGIN wss://API_HOST; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Never let the SPA shell itself be cached stale after a security fix ships:
add_header Cache-Control "no-cache" always;
